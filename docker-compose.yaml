name: raft-cluster

x-node-defaults: &node-defaults
  image: cringe-raft:local
  pull_policy: never
  build:
    context: .
  volumes:
    - type: bind
      source: ./config/cluster.yaml
      target: /app/config/cluster.yaml
      read_only: true
      bind:
        create_host_path: false

services:
  node-1:
    <<: *node-defaults
    ports:
      - "8081:8080"
    environment:
      RAFT_NODEID: node-1
      HANDLING_EVENT_LEVEL: TRACE
    networks:
      - raft-internal

  node-2:
    <<: *node-defaults
    ports:
      - "8082:8080"
    environment:
      RAFT_NODEID: node-2
      HANDLING_EVENT_LEVEL: TRACE
    networks:
      - raft-internal

  node-3:
    <<: *node-defaults
    ports:
      - "8083:8080"
    environment:
      RAFT_NODEID: node-3
      HANDLING_EVENT_LEVEL: TRACE
    networks:
      - raft-internal

networks:
  raft-internal:
    name: raft-cluster-internal
    driver: bridge
