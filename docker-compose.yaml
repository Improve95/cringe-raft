name: raft-cluster

x-node-defaults: &node-defaults
  image: cringe-raft:local
  pull_policy: never
  build:
    context: .

services:
  node-1:
    <<: *node-defaults
    ports:
      - "8081:8080"
    environment:
      RAFT_NODEID: node-1
      RAFT_PEERS_0_ID: node-2
      RAFT_PEERS_0_URL: http://node-2:8080
      RAFT_PEERS_1_ID: node-3
      RAFT_PEERS_1_URL: http://node-3:8080
      RAFT_PEERS_2_ID: node-4
      RAFT_PEERS_2_URL: http://node-4:8080

  node-2:
    <<: *node-defaults
    ports:
      - "8082:8080"
    environment:
      RAFT_NODEID: node-2
      RAFT_PEERS_0_ID: node-1
      RAFT_PEERS_0_URL: http://node-1:8080
      RAFT_PEERS_1_ID: node-3
      RAFT_PEERS_1_URL: http://node-3:8080
      RAFT_PEERS_2_ID: node-4
      RAFT_PEERS_2_URL: http://node-4:8080

  node-3:
    <<: *node-defaults
    ports:
      - "8083:8080"
    environment:
      RAFT_NODEID: node-3
      RAFT_PEERS_0_ID: node-1
      RAFT_PEERS_0_URL: http://node-1:8080
      RAFT_PEERS_1_ID: node-2
      RAFT_PEERS_1_URL: http://node-2:8080
      RAFT_PEERS_2_ID: node-4
      RAFT_PEERS_2_URL: http://node-4:8080

  node-4:
    <<: *node-defaults
    ports:
      - "8084:8080"
    environment:
      RAFT_NODEID: node-4
      RAFT_PEERS_0_ID: node-1
      RAFT_PEERS_0_URL: http://node-1:8080
      RAFT_PEERS_1_ID: node-2
      RAFT_PEERS_1_URL: http://node-2:8080
      RAFT_PEERS_2_ID: node-3
      RAFT_PEERS_2_URL: http://node-3:8080
