name: raft-cluster

x-node-defaults: &node-defaults
  build:
    dockerfile: Dockerfile
  volumes:
    - type: bind
      source: ./config/cluster.yaml
      target: /app/config/cluster.yaml
      read_only: true
      bind:
        create_host_path: false

services:
  node-1:
    <<: *node-defaults
    container_name: "node-1"
    ports:
      - "8081:8080"
    environment:
      RAFT_NODEID: node-1

  node-2:
    <<: *node-defaults
    container_name: "node-2"
    ports:
      - "8082:8080"
    environment:
      RAFT_NODEID: node-2

  node-3:
    <<: *node-defaults
    container_name: "node-3"
    ports:
      - "8083:8080"
    environment:
      RAFT_NODEID: node-3
