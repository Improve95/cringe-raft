x-node-defaults: &node-defaults
  image: cringe-raft:local
  pull_policy: never
  restart: unless-stopped

services:
  node-1:
    <<: *node-defaults
    build:
      context: .
    ports:
      - "8081:8080"
    environment:
      RAFT_NODEID: node-1
      RAFT_PEERS_0_ID: node-2
      RAFT_PEERS_0_URL: http://node-2:8080
      RAFT_PEERS_1_ID: node-3
      RAFT_PEERS_1_URL: http://node-3:8080
    networks:
      raft:
        ipv4_address: 172.28.0.11

  node-2:
    <<: *node-defaults
    ports:
      - "8082:8080"
    environment:
      RAFT_NODEID: node-2
      RAFT_PEERS_0_ID: node-1
      RAFT_PEERS_0_URL: http://node-1:8080
      RAFT_PEERS_1_ID: node-3
      RAFT_PEERS_1_URL: http://node-3:8080
    networks:
      raft:
        ipv4_address: 172.28.0.12

  node-3:
    <<: *node-defaults
    ports:
      - "8083:8080"
    environment:
      RAFT_NODEID: node-3
      RAFT_PEERS_0_ID: node-1
      RAFT_PEERS_0_URL: http://node-1:8080
      RAFT_PEERS_1_ID: node-2
      RAFT_PEERS_1_URL: http://node-2:8080
    networks:
      raft:
        ipv4_address: 172.28.0.13

networks:
  raft:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
