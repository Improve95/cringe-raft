spring:
  config:
    import: "${RAFT_CONFIG:file:./config/cluster.yaml}"
  application:
    name: raft
  threads:
    virtual:
      enabled: true

server:
  port: 8081

springdoc:
  packages-to-scan: ru.nsu.raft.api
  default-produces-media-type: application/json
  override-with-generic-response: false

raft:
  node-id: node-1
  election-timeout-min: 500ms
  election-timeout-max: 700ms
  heartbeat-interval: 75ms
  rpc-timeout: 1s
  transport:
    connect-timeout: 400ms
    read-timeout: 2s
