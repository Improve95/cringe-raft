spring:
  application:
    name: raft

server:
  port: 8081

raft:
  node-id: node-1
  peers: [ ]
  election-timeout-min: 300ms
  election-timeout-max: 600ms
  heartbeat-interval: 75ms
  rpc-timeout: 1s
  transport:
    connect-timeout: 500ms
    read-timeout: 2s

---
spring:
  config:
    activate:
      on-profile: node1
server:
  port: 8081
raft:
  node-id: node-1
  peers:
    - id: node-2
      url: http://localhost:8082
    - id: node-3
      url: http://localhost:8083

---
spring:
  config:
    activate:
      on-profile: node2
server:
  port: 8082
raft:
  node-id: node-2
  peers:
    - id: node-1
      url: http://localhost:8081
    - id: node-3
      url: http://localhost:8083

---
spring:
  config:
    activate:
      on-profile: node3
server:
  port: 8083
raft:
  node-id: node-3
  peers:
    - id: node-1
      url: http://localhost:8081
    - id: node-2
      url: http://localhost:8082
