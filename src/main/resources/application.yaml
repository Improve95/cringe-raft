spring:
  config:
    import: "${RAFT_CONFIG:file:./config/cluster.yaml}"
  application:
    name: raft
  threads:
    virtual:
      enabled: true
  mvc:
    servlet:
      load-on-startup: 1

server:
  port: 8081

springdoc:
  packages-to-scan: ru.nsu.raft.api
  default-produces-media-type: application/json
  override-with-generic-response: false

raft:
  node-id: node-1
  election-timeout-min: 500ms
  election-timeout-max: 800ms
  election-check-interval: 50ms
  heartbeat-interval: 200ms
  rpc-timeout: 1s
  transport:
    connect-timeout: 400ms
    read-timeout: 2s

logging:
  level:
    ru.nsu.raft: ${HANDLING_EVENT_LEVEL:DEBUG}
