spring:
  application:
    name: raft

server:
  port: 8081

springdoc:
  packages-to-scan: ru.nsu.raft.api
  default-produces-media-type: application/json
  override-with-generic-response: false

raft:
  node-id: node-1
  peers: [ ]
  election-timeout-min: 300ms
  election-timeout-max: 600ms
  heartbeat-interval: 75ms
  rpc-timeout: 1s
  transport:
    connect-timeout: 500ms
    read-timeout: 2s
